# Hydra CI

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structure:
    name: Repository structure & memory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Required files present
        run: |
          set -euo pipefail
          required=(
            LICENSE
            NOTICE
            README.md
            .gitignore
            hydra/STATE.md
            hydra/BACKLOG.md
            hydra/DECISOES.md
            hydra/LOG.md
            hydra/AUDITORIA-SINTAXE.md
            hydra/ESPECIFICACAO.md
            hydra/exemplos/01-hello.hy
            compiler/pom.xml
            compiler/src/main/java/hydra/compiler/lexer/Lexer.java
            .github/workflows/ci.yml
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            else
              echo "ok: $f ($(wc -l < "$f") lines)"
            fi
          done
          exit "$missing"

      - name: Memory docs are non-trivial
        run: |
          set -euo pipefail
          for f in hydra/STATE.md hydra/BACKLOG.md hydra/DECISOES.md hydra/LOG.md hydra/AUDITORIA-SINTAXE.md; do
            lines=$(wc -l < "$f")
            if [ "$lines" -lt 20 ]; then
              echo "FAIL: $f has only $lines lines (expected >= 20)"
              exit 1
            fi
          done
          echo "memory docs ok"

      - name: License and attribution
        run: |
          set -euo pipefail
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          grep -q "KofLang/Kof4j" NOTICE
          grep -qi "derived" NOTICE
          echo "license ok"

      - name: Syntax budget recorded
        run: |
          set -euo pipefail
          grep -qE "Orçamento|orçamento|budget|keyword|reservad" hydra/AUDITORIA-SINTAXE.md
          grep -qE "DECISOES|Decisão|Decisao" hydra/DECISOES.md
          echo "budget/decisions docs ok"

  upstream-compile:
    name: Kof upstream still compiles
    runs-on: ubuntu-latest
    needs: structure
    steps:
      - name: Checkout Hydra
        uses: actions/checkout@v5

      - name: Clone Kof upstream (read-only reference)
        run: git clone --depth 1 https://github.com/KofLang/Kof4j.git kof_upstream

      - name: Setup JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            kof_upstream/pom.xml
            kof_upstream/**/pom.xml

      - name: Build Kof compiler modules (skip tests)
        working-directory: kof_upstream
        run: |
          mvn -B -pl kof-compiler,kof-runtime,kof-script,kof-c-compiler install -DskipTests

  hydra-compiler:
    name: Hydra compiler tests
    runs-on: ubuntu-latest
    needs: structure
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: compiler/pom.xml

      - name: Test hydra-compiler
        working-directory: compiler
        run: mvn -B test
